<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ACTUWISE</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f172a;
            --blue: #00c07f;
            --blue-hover: #009663;
            --text-main: #334155;
            --border: #e2e8f0;
            --bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .split-layout {
            display: flex;
            width: 100%;
        }

        .image-section {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px;
            color: white;
        }

        .image-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(15,23,42,0.2) 0%, rgba(15,23,42,0.9) 100%);
            z-index: 1;
        }

        .image-content {
            position: relative;
            z-index: 2;
        }

        .image-content h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .image-content p {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.6;
            opacity: 0.9;
            max-width: 500px;
        }

        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: var(--blue);
            color: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(0, 192, 127, 0.3);
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
            background: #f8fafc;
        }

        .input-group input:focus {
            border-color: var(--blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 192, 127, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 192, 127, 0.2);
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: var(--blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 192, 127, 0.3);
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            display: none;
            text-align: center;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        @media (max-width: 900px) {
            .image-section { display: none; }
            .form-section { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Image Section -->
        <div class="image-section">
            <div class="image-overlay"></div>
            <div class="image-content">
                <h1>ACTUWISE</h1>
                <p>La plateforme actuarielle intelligente. Prédisez les risques, maîtrisez vos provisions et optimisez votre rentabilité grâce à l'IA.</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <div class="login-box">
                <div class="logo">
                    <div class="logo-icon">AW</div>
                    ACTUWISE
                </div>

                <h2>Connexion Espace Actuaire</h2>
                <p class="subtitle">Veuillez vous connecter pour accéder au tableau de bord.</p>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Adresse Email</label>
                        <input type="email" id="email" placeholder="actuaire@actuwise.com" required value="actuaire@actuwise.com">
                    </div>

                    <div class="input-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-submit">Se Connecter</button>
                    <div id="error-msg" class="error-message">Identifiants incorrects.</div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');

            btn.textContent = 'Connexion...';
            btn.style.opacity = '0.7';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('actuwise_token', data.access_token);
                    window.location.href = '/app.html';
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = 'Email ou mot de passe incorrect.';
                }
            } catch (err) {
                console.error(err);
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Erreur de connexion au serveur.';
            } finally {
                btn.textContent = 'Se Connecter';
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
